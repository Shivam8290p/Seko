<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Primary meta -->
    <title>Seko — Campus Marketplace</title>
    <meta name="description" content="Seko — Campus marketplace where students buy and sell second-hand books, electronics, lab equipment, and more." />
    <meta name="theme-color" content="#2b6cb0" />

    <!-- Favicon — replace favicon.svg with your own brand icon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Open Graph / social preview (crawlers don't run JS — these must be static) -->
    <meta property="og:type"        content="website" />
    <meta property="og:url"         content="https://YOUR_DOMAIN/" />
    <meta property="og:title"       content="Seko — Campus Marketplace" />
    <meta property="og:description" content="Buy and sell second-hand books, electronics, lab equipment and more on campus." />
    <meta property="og:image"       content="https://YOUR_DOMAIN/og-image.jpg" />
    <meta property="og:image:width"  content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale"      content="en_IN" />

    <!-- Twitter card -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:title"       content="Seko — Campus Marketplace" />
    <meta name="twitter:description" content="Buy and sell second-hand goods on campus." />
    <meta name="twitter:image"       content="https://YOUR_DOMAIN/og-image.jpg" />

    <!-- PWA / Apple -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Seko" />

    <!-- Google Fonts — preconnect to reduce render-blocking latency -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
